type: object
properties:
  id:
    type: integer
    description: Unique identifier of the zone.
    example: 1
  code:
    type: string
    description: Unique system code for the zone.
    example: "ZONE_A"
  name:
    type: string
    description: Display name of the zone.
    example: "Zone A"
required:
  - id
  - code
  - name
